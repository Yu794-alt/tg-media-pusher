<div id="modal-auth" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-2xl w-full max-w-md mx-4 transform transition-transform duration-200 scale-60">
        <!-- Заголовок -->
        <div class="flex justify-between  items-center p-4">
            <h3 class="text-lg font-semibold">Sign in</h3>
            <div class="flex gap-10 items-center">
                <div class="text-xs text-secondary cursor-pointer" onclick="handleRedirectSignUp()">
                    Sign up
                </div>
                <button
                        onclick="closeModal('modal-auth')"
                        class="text-gray-400 hover:text-gray-600 text-2xl leading-none "
                >
                    &times;
                </button>
            </div>
        </div>
        <form action="/signin" method="post">
            <div class="flex px-4 flex-col gap-3">
                <div class="input">
                    <input id="login" name="login" placeholder="Login" type="text">
                </div>
                <div class="input">
                    <input id="password" name="password" type="password" placeholder="Password">
                </div>
            </div>
            <div class="flex justify-end gap-2 p-4 ">
                <button
                        onclick="closeModal('modal-auth')"
                        class="btn-secondary"
                >
                    Cancel
                </button>
                <button
                        class="btn-primary"
                        type="submit"
                >
                    Submit
                </button>

            </div>
        </form>

    </div>
</div>

<script>

    function openModal(modalId) {
        console.log('modalId', modalId)
        const modal = document.getElementById(modalId);
        modal.classList.remove('hidden');
        setTimeout(() => {
            modal.querySelector('div').classList.remove('scale-60');
        }, 10);
    }

    function closeModal(modalId) {
        const modal = document.getElementById(modalId);
        modal.querySelector('div').classList.add('scale-60');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 150);
    }


    function handleRedirectSignUp(e) {
        closeModal('modal-auth');
        openModal('modal-register');
    }

    document.getElementById('modal-auth').addEventListener('click', function (e) {
        if (e.target === this) {
            closeModal('modal-auth');
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            closeModal('modal-auth');
        }
    });
</script>
