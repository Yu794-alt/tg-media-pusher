    <!-- Оптимизированная группа с анимацией -->
    <g transform="translate(0.000000,327.000000) scale(0.100000,-0.100000)"
       fill="none"
       stroke-width="15"
       stroke-linecap="round"
       stroke-dasharray="1 50"
       stroke-dashoffset="2000">

